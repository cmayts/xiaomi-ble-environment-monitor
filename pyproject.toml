[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaomi-ble-environment-monitor"
version = "1.0.0"
description = "Linux collector for Xiaomi BLE temperature and humidity sensors"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["bleak>=0.22,<2"]

[project.scripts]
xiaomi-ble-monitor = "xiaomi_ble_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["xiaomi_ble_monitor*"]
